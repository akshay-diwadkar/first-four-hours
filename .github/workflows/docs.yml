name: Docs

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install zensical==0.0.74
      - run: zensical build --clean
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.160.1 pages deploy site
          --project-name=first-four-hours
          --branch=main
          --commit-hash=${{ github.sha }}
      # The old GitHub Pages address now only redirects to Cloudflare Pages,
      # keeping each page's path so existing links still land on the right page.
      - name: Build GitHub Pages redirect
        if: github.event_name == 'push'
        run: |
          mkdir redirect
          cat > redirect/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>First Four Hours has moved</title>
          <link rel="canonical" href="https://first-four-hours.pages.dev/">
          <meta http-equiv="refresh" content="0; url=https://first-four-hours.pages.dev/">
          <script>
            location.replace("https://first-four-hours.pages.dev" +
              location.pathname.replace(/^\/first-four-hours/, "") +
              location.search + location.hash);
          </script>
          <p>The documentation has moved to <a href="https://first-four-hours.pages.dev/">first-four-hours.pages.dev</a>.</p>
          EOF
          cp redirect/index.html redirect/404.html
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirect

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
