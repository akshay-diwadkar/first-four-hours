name: Publish wiki

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the wiki pages from docs/
        run: >-
          python3 tools/wiki/publish_wiki.py
          --repository "$GITHUB_REPOSITORY"
          --branch "$GITHUB_REF_NAME"
          --output "$RUNNER_TEMP/wiki-pages"

      - name: Replace the wiki with the built pages
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          wiki="$RUNNER_TEMP/wiki"
          if ! git clone --depth 1 "https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$wiki"; then
            echo "::error::Could not clone the wiki. Enable the wiki and create its first page once in the GitHub web interface, then rerun this workflow."
            exit 1
          fi
          find "$wiki" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/wiki-pages/"*.md "$wiki/"
          cd "$wiki"
          git add --all
          if git diff --cached --quiet; then
            echo "The wiki already matches docs/."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Publish docs/ from ${GITHUB_SHA}"
          git push origin HEAD
