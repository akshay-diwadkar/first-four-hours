<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{exam_title}}: original practice paper</title>
<style>
:root { color-scheme: light dark; --fg: #1b1b1b; --bg: #ffffff; --accent: #0b57d0; }
@media (prefers-color-scheme: dark) { :root { --fg: #e8e8e8; --bg: #141414; --accent: #8ab4f8; } }
body { font: 1.05rem/1.6 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
a { color: var(--accent); }
@media print { body { max-width: none; color: #000; background: #fff; } a { color: #000; } }
</style>
</head>
<body>
<main>
<h1>{{exam_title}}: original practice paper</h1>
<!-- fill: replace the title and this heading, derived from folder names, with the real title -->
<!-- fill: cover instructions naming this an original practice paper, not the awarding body's, with any approximation label, the rules for candidates, and total marks -->
<script type="application/json" id="paper-meta">{"id": "{{set_id}}", "title": "", "parts": [], "access": {}}</script>
<!-- fill: the paper-meta title and parts from the applicable session's own paper, as the paper runtime's opening comment defines -->
<!-- fill: numbered questions, each a section.paper-question with data-question and data-part, holding its labelled answer controls and every supplied material -->
</main>
<!-- paper-runtime -->
</body>
</html>
