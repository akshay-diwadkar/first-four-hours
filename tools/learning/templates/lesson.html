<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{topic_title}}</title>
<style>
:root { color-scheme: light dark; --fg: #1b1b1b; --bg: #ffffff; --accent: #0b57d0; }
@media (prefers-color-scheme: dark) { :root { --fg: #e8e8e8; --bg: #141414; --accent: #8ab4f8; } }
body { font: 1.05rem/1.6 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
a { color: var(--accent); }
@media print { body { max-width: none; color: #000; background: #fff; } a { color: #000; } }
</style>
</head>
<body>
<main>
<h1>{{topic_title}}</h1>
<!-- fill: replace the title and this heading, derived from folder names, with the real title -->
<!-- fill: teaching material: the explanation, examples, visuals, and exercises, readable later without the conversation, with citations for researched claims -->
<!-- fill: relative links to the study plan and related lessons that exist -->
<section id="learning-record">
<h2>Learning record</h2>
<h3>Demonstrated</h3>
<!-- fill: what the learner showed, each with its evidence and representation; for a kept explanation with no practice, say so and remove this heading -->
<h3>Unresolved</h3>
<!-- fill: open difficulties and misconceptions, steps passed with help, and, apart as not converged, unaided evidence that does not yet meet the check rules -->
<h3>Next</h3>
<!-- fill: the next step -->
<h3>Updated</h3>
<p><time datetime="{{date}}">{{date}}</time></p>
</section>
</main>
</body>
</html>
