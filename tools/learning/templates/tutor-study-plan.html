<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study plan: {{subject_title}}</title>
<style>
:root { color-scheme: light dark; --fg: #1b1b1b; --bg: #ffffff; --accent: #0b57d0; }
@media (prefers-color-scheme: dark) { :root { --fg: #e8e8e8; --bg: #141414; --accent: #8ab4f8; } }
body { font: 1.05rem/1.6 system-ui, sans-serif; color: var(--fg); background: var(--bg); max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
a { color: var(--accent); }
@media print { body { max-width: none; color: #000; background: #fff; } a { color: #000; } }
</style>
</head>
<body>
<main>
<h1>Study plan: {{subject_title}}</h1>
<!-- fill: replace the title and this heading, derived from folder names, with the real title -->
<section id="goal">
<h2>Goal</h2>
<!-- fill: what the learner wants to be able to do, any deadline or examination date, and the time available, as the learner states it -->
</section>
<section id="learning-sequence">
<h2>Learning sequence</h2>
<h3>Sequence</h3>
<!-- fill: topics in order, each with its prerequisites and, once it exists, a relative link to its lesson -->
<h3>Schedule</h3>
<!-- fill: sessions or dates that fit the available time, less what other sections already schedule, with spaced retrieval review and milestones -->
<h3>Progress</h3>
<!-- fill: each topic as not started, taught, demonstrated, or needs revision, judged from lesson records -->
</section>
</main>
</body>
</html>
