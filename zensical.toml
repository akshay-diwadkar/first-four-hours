[project]
site_name = "First Four Hours"
site_description = "Skills for coding agents. Sharpen the axe first."
site_url = "https://akshay-diwadkar.github.io/first-four-hours/"
repo_url = "https://github.com/akshay-diwadkar/first-four-hours"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "README.md" },
  { "Get started" = [
    { "Install First Four Hours" = "getting-started/installation.md" },
    { "Your first run" = "getting-started/first-run.md" },
    { "Choose a skill" = "getting-started/choosing-a-skill.md" },
  ] },
  { "Understand the suite" = [
    { "Why First Four Hours exists" = "concepts/why-first-four-hours.md" },
    { "How the suite works" = "concepts/how-the-suite-works.md" },
    { "Anatomy of a sealed blueprint" = "concepts/anatomy-of-a-blueprint.md" },
    { "How skills hand work to each other" = "concepts/handoffs.md" },
  ] },
  { "Skills" = [
    "skills/README.md",
    { "Architect" = "skills/architect.md" },
    { "Assess" = "skills/assess.md" },
    { "Blueprint" = "skills/blueprint.md" },
    { "Charter" = "skills/charter.md" },
    { "Construct" = "skills/construct.md" },
    { "Diagnose" = "skills/diagnose.md" },
    { "PR" = "skills/pr.md" },
    { "Provision" = "skills/provision.md" },
    { "Temper" = "skills/temper.md" },
    { "Ticket" = "skills/ticket.md" },
    { "Ideate" = "skills/ideate.md" },
    { "Reason" = "skills/reason.md" },
    { "Router" = "skills/router.md" },
    { "Scribe" = "skills/scribe.md" },
    { "Examiner" = "skills/examiner.md" },
    { "Tutor" = "skills/tutor.md" },
  ] },
  { "Solve a recurring problem" = [
    "recipes/README.md",
    { "Plan a change before your agent starts editing" = "recipes/plan-a-change.md" },
    { "Fix the bug without patching the symptom" = "recipes/fix-a-bug.md" },
    { "Settle the structure before agents add parallel machinery" = "recipes/settle-structure.md" },
    { "Work through a large ticket without losing the thread" = "recipes/work-through-a-large-ticket.md" },
    { "Trust a change before you merge it" = "recipes/review-before-merge.md" },
    { "Find the next step when work spans several skills" = "recipes/find-the-next-skill.md" },
    { "Get a stuck decision moving again" = "recipes/unstick-a-decision.md" },
    { "Write documentation that matches its sources" = "recipes/write-docs-from-sources.md" },
    { "Learn a subject and practise for its exam" = "recipes/learn-and-practise.md" },
  ] },
  { "Look something up" = [
    "reference/README.md",
  ] },
  { "Fix a problem" = [
    "troubleshooting/README.md",
  ] },
  { "Contribute" = [
    "contributing/README.md",
    { "Validate a repository change" = "contributing/validation.md" },
    { "Maintain packages and releases" = "contributing/packages-and-releases.md" },
    { "Writing the documentation" = "contributing/documentation.md" },
  ] },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.indexes",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
tables = {}
toc = {}
"pymdownx.highlight" = {}
"pymdownx.superfences" = {}
